<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(
        -45deg,
        #ff006e,
        #8338ec,
        #3a86ff,
        #00f5d4,
        #ffbe0b
      );
      background-size: 400% 400%;
      animation: fondo 10s ease infinite;
    }

    .contenedor {
      position: relative;
      padding: 60px 90px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        0 0 50px rgba(255, 255, 255, 0.2);
      animation: aparecer 1.5s ease;
    }

    h1 {
      font-size: clamp(55px, 10vw, 130px);
      font-weight: 900;
      letter-spacing: 5px;
      color: white;
      text-shadow:
        0 0 10px #ffffff,
        0 0 20px #00f5ff,
        0 0 40px #8338ec,
        0 0 80px #ff006e;
      animation:
        flotar 3s ease-in-out infinite,
        brillo 2s alternate infinite;
    }

    p {
      margin-top: 20px;
      color: white;
      font-size: 22px;
      letter-spacing: 4px;
      animation: parpadeo 2s infinite;
    }

    .circulo {
      position: absolute;
      border-radius: 50%;
      filter: blur(3px);
      opacity: 0.7;
      animation: mover 8s infinite alternate ease-in-out;
    }

    .circulo1 {
      width: 180px;
      height: 180px;
      background: #ff006e;
      top: 10%;
      left: 10%;
    }

    .circulo2 {
      width: 250px;
      height: 250px;
      background: #00f5d4;
      bottom: 5%;
      right: 8%;
      animation-delay: -3s;
    }

    .circulo3 {
      width: 130px;
      height: 130px;
      background: #ffbe0b;
      top: 15%;
      right: 20%;
      animation-delay: -5s;
    }

    @keyframes fondo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.05); }
    }

    @keyframes brillo {
      from { filter: brightness(1); }
      to { filter: brightness(1.6); }
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes mover {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(100px, 80px) scale(1.4); }
    }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>

<body>

  <div class="circulo circulo1"></div>
  <div class="circulo circulo2"></div>
  <div class="circulo circulo3"></div>

  <div class="contenedor">
    <h1>¡HOLA MUNDO!</h1>
    <p>MI PRIMERA PÁGINA HTML</p>
  </div>

</body>
</html>
